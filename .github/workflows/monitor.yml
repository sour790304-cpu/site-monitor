name: Site monitor
on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub 實際觸發約 5-10 分鐘一次
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test LINE alert first'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check sites
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
        run: bash check.sh
      - name: Keepalive commit (repo 60 天沒 commit,GitHub 會自動停用排程;每 25 天自動補一筆心跳)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 25 ]; then
            git pull -q --rebase || true
            date -u +%FT%TZ > .heartbeat
            git config user.name "site-monitor-bot"
            git config user.email "site-monitor-bot@users.noreply.github.com"
            git add .heartbeat
            git commit -q -m "heartbeat: keepalive $(date -u +%F)"
            git push -q
          fi
